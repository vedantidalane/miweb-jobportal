<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Post Job - Job Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">JobPortal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="employer-dashboard.html">My Jobs</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h2 class="mb-3">Post a New Job</h2>
        <form id="postJobForm">
            <div class="mb-3"><label class="form-label" for="title">Job Title</label><input type="text" class="form-control" id="title" required></div>
            <div class="mb-3"><label class="form-label" for="company">Company</label><input type="text" class="form-control" id="company" required></div>
            <div class="mb-3"><label class="form-label" for="location">Location</label><input type="text" class="form-control" id="location" required></div>
            <div class="mb-3"><label class="form-label" for="experience">Experience (years)</label><input type="number" class="form-control" id="experience" min="0" required></div>
            <div class="mb-3"><label class="form-label" for="salary">Salary ($ per annum)</label><input type="number" class="form-control" id="salary" min="0" required></div>
            <div class="mb-3"><label class="form-label" for="description">Job Description</label><textarea class="form-control" id="description" rows="4" required></textarea></div>
            <button type="submit" class="btn btn-primary">Post Job</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/employer.js"></script>
</body>
</html>
