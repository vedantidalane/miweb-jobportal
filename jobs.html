<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Find Jobs - CareerConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <style>
        .search-banner { background: linear-gradient(135deg,#0d6efd,#6610f2); padding: 36px 0; }
        .job-card { border-radius:12px; border:1px solid #e9ecef; background:#fff; transition:transform .2s,box-shadow .2s; }
        .job-card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.12); }
        .job-badge { font-size:.72rem; padding:.3rem .6rem; border-radius:20px; }
        .save-btn.saved { color:#dc3545; border-color:#dc3545; }
        .filter-sidebar { position:sticky; top:76px; }
        body.dark-mode .job-card { background:#1e1e1e; border-color:#333; color:#e0e0e0; }
        body.dark-mode .job-card .text-muted { color:#aaa !important; }
        body.dark-mode .filter-sidebar .card { background:#1e1e1e; border-color:#333; }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="bi bi-briefcase-fill fs-3 text-primary me-2"></i>
                <span class="h5 mb-0">CareerConnect</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="jobs.html">Find Jobs</a></li>
                    <li class="nav-item"><a class="nav-link" href="companies.html">Companies</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="candidate-login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="candidate-register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-primary text-white ms-2" href="employer-login.html">Post a Job</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="themeToggle"><i class="fas fa-moon"></i></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Search Banner -->
    <div class="search-banner text-white">
        <div class="container">
            <h4 class="fw-bold mb-3">Search Jobs</h4>
            <div class="row g-2">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-0"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="searchInput" class="form-control border-0 py-2" placeholder="Job title, skills or keywords" />
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-0"><i class="fas fa-map-marker-alt text-muted"></i></span>
                        <input type="text" id="locationInput" class="form-control border-0 py-2" placeholder="Location" />
                    </div>
                </div>
                <div class="col-md-3">
                    <select id="categoryFilter" class="form-select border-0 py-2">
                        <option value="">All Categories</option>
                        <option>Software Development</option>
                        <option>Data Science</option>
                        <option>Marketing</option>
                        <option>Finance & Accounting</option>
                        <option>Human Resources</option>
                        <option>UI/UX Design</option>
                        <option>Sales & Business Development</option>
                        <option>Customer Support</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button id="searchBtn" class="btn btn-light w-100 fw-semibold py-2">
                        <i class="fas fa-search me-1"></i> Search
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container py-4">
        <div class="row g-4">

            <!-- Sidebar Filters -->
            <div class="col-md-3">
                <div class="filter-sidebar">
                    <div class="card border-0 shadow-sm p-3 mb-3">
                        <h6 class="fw-bold mb-3"><i class="fas fa-filter me-2 text-primary"></i>Filters</h6>
                        <label class="form-label small fw-semibold">Job Type</label>
                        <div id="jobTypeFilters" class="mb-3">
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="Full-time" id="ft"><label class="form-check-label small" for="ft">Full-time</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="Part-time" id="pt"><label class="form-check-label small" for="pt">Part-time</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="Remote" id="rm"><label class="form-check-label small" for="rm">Remote</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="Contract" id="ct"><label class="form-check-label small" for="ct">Contract</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="Internship" id="in"><label class="form-check-label small" for="in">Internship</label></div>
                        </div>
                        <label class="form-label small fw-semibold">Experience</label>
                        <select id="experienceFilter" class="form-select form-select-sm mb-3">
                            <option value="">Any Experience</option>
                            <option value="0">Fresher (0 yrs)</option>
                            <option value="1">1+ years</option>
                            <option value="2">2+ years</option>
                            <option value="3">3+ years</option>
                            <option value="5">5+ years</option>
                        </select>
                        <label class="form-label small fw-semibold">Min Salary</label>
                        <select id="salaryFilter" class="form-select form-select-sm mb-3">
                            <option value="">Any Salary</option>
                            <option value="300000">3 LPA+</option>
                            <option value="500000">5 LPA+</option>
                            <option value="800000">8 LPA+</option>
                            <option value="1200000">12 LPA+</option>
                            <option value="2000000">20 LPA+</option>
                        </select>
                        <button id="clearFilters" class="btn btn-outline-secondary btn-sm w-100">Clear Filters</button>
                    </div>
                </div>
            </div>

            <!-- Job Cards -->
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span id="resultCount" class="text-muted small fw-semibold"></span>
                    <select id="sortFilter" class="form-select form-select-sm w-auto">
                        <option value="newest">Newest First</option>
                        <option value="salary_high">Salary: High to Low</option>
                        <option value="salary_low">Salary: Low to High</option>
                    </select>
                </div>
                <div id="jobCardsContainer" class="d-flex flex-column gap-3"></div>
                <div id="noResults" class="text-center py-5" style="display:none;">
                    <i class="fas fa-search fa-3x text-muted mb-3"></i>
                    <h5 class="text-muted">No jobs found</h5>
                    <p class="text-muted">Try different keywords or clear the filters.</p>
                    <button class="btn btn-outline-primary" id="clearFilters2">Clear All Filters</button>
                </div>
                <nav class="mt-4">
                    <ul class="pagination justify-content-center" id="pagination"></ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-3">
        <div class="container text-center">
            <small>&copy; 2024 CareerConnect. All rights reserved.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/portal.js"></script>
    <script>
    // Guard "Apply Now" links – redirect to login if not logged in
    document.addEventListener('click', function(e) {
        const link = e.target.closest('a[href^="apply-job.html"]');
        if (!link) return;
        const candidate = JSON.parse(localStorage.getItem('candidate') || 'null');
        if (!candidate) {
            e.preventDefault();
            localStorage.setItem('redirectAfterLogin', link.href);
            alert('Please login or register first to apply for a job.');
            window.location.href = 'candidate-login.html';
        }
    });
    // Read URL params from home hero search and pre-fill
    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('q')) document.getElementById('searchInput').value = params.get('q');
        if (params.get('loc')) document.getElementById('locationInput').value = params.get('loc');
        if (params.get('cat')) {
            const sel = document.getElementById('categoryFilter');
            [...sel.options].forEach(o => { if (o.value === params.get('cat')) o.selected = true; });
        }
        if (params.get('company')) document.getElementById('searchInput').value = params.get('company');
    });
    </script>
</body>
</html>
