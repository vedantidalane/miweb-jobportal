<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jobs - Job Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">JobPortal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="jobs.html">Jobs</a></li>
                    <li class="nav-item"><a class="nav-link" href="candidate-login.html">Candidate Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="employer-dashboard.html">Employer Dashboard</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <h2 class="mb-4">Job Listings</h2>
        <!-- Filters (placeholder) -->
        <div class="row mb-3">
            <div class="col-md-3">
                <input type="text" class="form-control" placeholder="Search..." id="searchInput" />
            </div>
            <div class="col-md-2">
                <select class="form-select" id="locationFilter"><option value="">All Locations</option></select>
            </div>
            <div class="col-md-2">
                <select class="form-select" id="experienceFilter"><option value="">All Experience</option></select>
            </div>
            <div class="col-md-2">
                <select class="form-select" id="salaryFilter"><option value="">All Salaries</option></select>
            </div>
        </div>
        <!-- Job cards container -->
        <div class="row" id="jobCardsContainer">
            <!-- Placeholder cards will be rendered by JS -->
        </div>
        <!-- Pagination (placeholder) -->
        <nav aria-label="Job pagination">
            <ul class="pagination justify-content-center mt-4" id="pagination"></ul>
        </nav>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/portal.js"></script>
</body>
</html>
