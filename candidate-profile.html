<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Candidate Profile - Job Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">JobPortal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="jobs.html">Jobs</a></li>
                    <li class="nav-item"><a class="nav-link active" href="candidate-profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="candidate-dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <h2 class="mb-4">My Profile</h2>
        <form id="profileForm">
            <div class="mb-3"><label class="form-label" for="fullName">Full Name</label><input type="text" class="form-control" id="fullName" required></div>
            <div class="mb-3"><label class="form-label" for="email">Email</label><input type="email" class="form-control" id="email" required disabled></div>
            <div class="mb-3"><label class="form-label" for="phone">Phone</label><input type="tel" class="form-control" id="phone"></div>
            <div class="mb-3"><label class="form-label" for="location">Location</label><input type="text" class="form-control" id="location"></div>
            <div class="mb-3"><label class="form-label" for="experience">Experience (years)</label><input type="number" class="form-control" id="experience" min="0"></div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
